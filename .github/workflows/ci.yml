name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# Cancel a superseded run (e.g. a new push to the same PR) instead of letting
# both run to completion.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default: none of these jobs need to write to the repo, open
# checks, or comment on PRs (branch-protection status checks come from the
# job results themselves, not from a token permission).
permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Generate Prisma client (for types)
        run: npx prisma generate
        env:
          DATABASE_URL: mysql://user:password@localhost:3306/haveninlipa
      - run: npm run typecheck

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      # Prisma types are needed because the availability/inventory modules import
      # generated types, even though the tests themselves never touch a database.
      - name: Generate Prisma client (for types)
        run: npx prisma generate
        env:
          DATABASE_URL: mysql://user:password@localhost:3306/haveninlipa
      # Runs the suite three times, under TZ=America/Chicago, Asia/Manila and UTC, so a
      # local-time date bug cannot pass by virtue of the runner being on UTC.
      - run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      # Parsed by Prisma Client generation and by Next.js env validation at
      # compile time only — never contacted. This job runs `build:app`
      # (prisma generate + next build), never the production `build` script,
      # so no schema push / migration / seed ever runs here and no
      # database connection is ever attempted. See "CI build vs. production
      # build" in the Website Technical Specification.
      DATABASE_URL: mysql://user:password@localhost:3306/haveninlipa
      NEXTAUTH_SECRET: ci-secret-placeholder
      NEXTAUTH_URL: http://localhost:3000
      SKIP_ENV_VALIDATION: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Build application (compile-only — no database write)
        run: npm run build:app

  # Not hosted-database work: everything here runs against a throwaway MariaDB container on
  # the runner's own localhost, on the same engine family as production (MariaDB 11.8 / InnoDB).
  # It proves that the migration history rebuilds a database matching schema.prisma (so a
  # schema.prisma edit without a migration fails here), and exercises the release gate and the
  # operator command through their baseline, pending, failing and drift scenarios.
  migrations:
    name: Migrations
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: ci-throwaway
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DATABASE_URL: mysql://root:ci-throwaway@127.0.0.1:3306/ci_unused
      TEST_DATABASE_SERVER_URL: mysql://root:ci-throwaway@127.0.0.1:3306
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Migration history, release gate and operator command (throwaway database)
        run: npm run test:migrations
