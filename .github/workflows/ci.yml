name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Generate Prisma client (for types)
        run: npx prisma generate
        env:
          DATABASE_URL: mysql://user:password@localhost:3306/haveninlipa
      - run: npm run typecheck

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      # Prisma types are needed because the availability/inventory modules import
      # generated types, even though the tests themselves never touch a database.
      - name: Generate Prisma client (for types)
        run: npx prisma generate
        env:
          DATABASE_URL: mysql://user:password@localhost:3306/haveninlipa
      # Runs the suite twice, under TZ=America/Chicago and TZ=Asia/Manila, so a
      # local-time date bug cannot pass by virtue of the runner being on UTC.
      - run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      # Required for Prisma generate (no real DB needed for build check)
      DATABASE_URL: mysql://user:password@localhost:3306/haveninlipa
      NEXTAUTH_SECRET: ci-secret-placeholder
      NEXTAUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Build Next.js app
        run: npx next build
        env:
          SKIP_ENV_VALIDATION: true
